<!doctype html><meta charset="utf-8"><style>body{margin:0;font:14px system-ui;color:#172033}canvas{width:100%;height:310px;touch-action:none;background:#f8fafc}p{margin:6px}input{vertical-align:middle}.bar{height:12px;background:linear-gradient(to right,#b91c1c,#e8bb39,#26a479,#2671c7);margin:8px}.legend{position:relative;height:20px}.legend span{position:absolute}.legend span:nth-child(1){left:0}.legend span:nth-child(2){left:20%;transform:translateX(-50%)}.legend span:nth-child(3){right:0}</style><canvas id="mesh"></canvas><p id="stats"></p><div class="bar"></div><p class="legend"><span>SJ ≤ 0</span><span>0.2 threshold</span><span>1</span></p><p>Drag to rotate · wheel to zoom <button id="reset">Reset</button> <label><input id="edges" type="checkbox" checked>Element edges</label></p><p>Colors use each cell's computed minimum corner SJ. Surface faces inherit their cell's value; hidden interior cells are included in the minimum below.</p><script>
const canvas=document.getElementById('mesh'),ctx=canvas.getContext('2d');const topView=new URLSearchParams(location.search).get('view')==='top';const initialAx=topView?0:Math.PI/4,initialAy=topView?0:-Math.asin(1/Math.sqrt(3));let data,ax=initialAx,ay=initialAy,zoom=1,drag;
function color(v){v=Math.max(0,Math.min(1,v));let colors=[[185,28,28],[232,187,57],[38,164,121],[38,113,199]],u=v*3,i=Math.min(2,Math.floor(u)),t=u-i;return 'rgb('+colors[i].map((c,k)=>Math.round(c*(1-t)+colors[i+1][k]*t)).join(',')+')'}
function draw(){if(!data)return;const w=canvas.clientWidth,h=310,dpr=devicePixelRatio;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);const p=data.points.map(p=>{let [x,y,z]=p.map((v,i)=>v-data.center[i]),Y=y*Math.cos(ax)-z*Math.sin(ax),Z=y*Math.sin(ax)+z*Math.cos(ax),X=x*Math.cos(ay)+Z*Math.sin(ay);Z=-x*Math.sin(ay)+Z*Math.cos(ay);return[w/2+X*data.scale*Math.min(w,h)*zoom,h/2-Y*data.scale*Math.min(w,h)*zoom,Z]});let faces=data.faces.map(f=>({f,z:f[0].reduce((s,n)=>s+p[n][2],0)/4})).sort((a,b)=>a.z-b.z);for(let {f} of faces){ctx.beginPath();f[0].forEach((n,i)=>{let q=p[n];i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])});ctx.closePath();ctx.fillStyle=color(f[1]);ctx.fill();if(document.getElementById('edges').checked){ctx.strokeStyle='rgba(15,23,42,.45)';ctx.lineWidth=.45;ctx.stroke()}}}
canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(drag){ay+=(e.clientX-drag[0])*.008;ax+=(e.clientY-drag[1])*.008;drag=[e.clientX,e.clientY];draw()}};canvas.onpointerup=()=>drag=null;canvas.onwheel=e=>{e.preventDefault();zoom=Math.max(.25,Math.min(5,zoom*Math.exp(-e.deltaY*.001)));draw()};document.getElementById('edges').onchange=draw;document.getElementById('reset').onclick=()=>{ax=initialAx;ay=initialAy;zoom=1;draw()};window.onresize=draw;fetch('sonnet-mesh.json').then(r=>r.json()).then(d=>{data=d;document.getElementById('stats').textContent=d.cells+' hex elements · minimum SJ '+d.min_sj.toFixed(4)+' · '+d.below_threshold+' below 0.2';draw()});
</script>
